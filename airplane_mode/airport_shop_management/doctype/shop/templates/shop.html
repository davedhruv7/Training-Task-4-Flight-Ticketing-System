
<!-- this is a sample default web page template -->
{% extends "templates/web.html" %}

{% block page_content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Card</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
<style>
  .lato-bold {
  font-family: "Lato", sans-serif;
  font-weight: 700;
  font-style: normal;
}
.lato {
  font-family: "Lato", sans-serif;
  font-weight: 600;
  font-style: normal;
}
</style>
</head>
<body>
<div class="container">
<h3 class="lato-bold">{{ title }}</h3>
<br>
<h4 class="lato">Shop Details</h4>
<ul style="font-size: 15px;" class="text-secondary">
 

</ul>


</body>
</html>

<div class="card">
    <div class="card-header">
      {{title}}
    </div>
    <div class="card-body">
      <h4 class="card-title"><b>{{shop_name}}</b></h4>
      <p class="card-text"><b>Airport:</b> {{airport}}</p>
      <p class="card-text"><b>Airport Code:</b> {{airport_code}}</p>
      <p class="card-text"><b>Shop Area:</b> {{shop_area}}</p>
      <a href="/shop-lead/new?shop={{ doc.name | urlencode }}" class="btn btn-primary">I'm Interested!</a>
    </div>
  </div>
{% endblock %}
