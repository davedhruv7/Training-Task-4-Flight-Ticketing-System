
<!-- this is a sample default list template -->

<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Card</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
<style>
  
</style>
</head>
<body> 
 
<div class="container">
  <div class="card">
    <div class="card-body">
		<div class="text-decoration-none">
			{% set a = frappe.get_doc("Airplane", doc.airplane) %}
			<a href="{{ doc.route }}" class="text-dark" >{{ a.airline }}</a>
			<h6 style="font-size: 12px;" class="mt-1"><b>{{source_airport_code}} <i class="bi bi-arrow-right"></i> {{destination_airport_code}}</b></h6>
			<h6 style="font-size: 12px;">{{ frappe.utils.format_date(date_of_departure, "d MMMM, YYYY") }} | {{time_of_departure}} | {{frappe.utils.format_duration(duration)}}</h6>
			<a style="font-size: 14px;" href="{{ doc.route }}" >View Flight</a>
		</div>

	</div>
	
  </div>
</div>
<br>

</body>
</html>
